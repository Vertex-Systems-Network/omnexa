name: Omnexa LOCAL-WIN-4 Discovery

on:
  pull_request:
    paths:
      - '.github/workflows/local-win-4-probe.yml'

permissions:
  contents: read

jobs:
  discover:
    name: discover-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5

    steps:
      - name: Report actual runner
        shell: cmd
        run: |
          echo SLOT=${{ matrix.slot }}
          echo RUNNER_NAME=%RUNNER_NAME%
          echo RUNNER_OS=%RUNNER_OS%
          echo RUNNER_ARCH=%RUNNER_ARCH%
          echo COMPUTERNAME=%COMPUTERNAME%
          if /I "%RUNNER_NAME%"=="LOCAL-WIN-4" echo TARGET_LOCAL_WIN_4=YES
          if /I not "%RUNNER_NAME%"=="LOCAL-WIN-4" echo TARGET_LOCAL_WIN_4=NO
          ping 127.0.0.1 -n 16 > nul
