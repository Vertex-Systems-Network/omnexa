name: Omnexa Local GitHub Admin Probe

on:
  pull_request:
    paths:
      - '.github/workflows/admin-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: admin-probe
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify runner account and GitHub CLI state
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME% / %RUNNER_OS% / %RUNNER_ARCH%
          echo Computer: %COMPUTERNAME%
          echo User: %USERNAME%
          echo UserProfile: %USERPROFILE%
          whoami
          where gh
          gh --version
          gh auth status -h github.com || echo GH_AUTH=NOT_AUTHENTICATED
