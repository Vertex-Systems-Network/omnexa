name: Omnexa Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: governance-v17-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: omnexa
          POSTGRES_PASSWORD: synthetic-p01-04
          POSTGRES_DB: omnexa_p01_04
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnexa -d omnexa_p01_04"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.1.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      s3mock:
        image: adobe/s3mock:5.1.0
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: omnexa-p01-06
        ports:
          - 9090:9090

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub-hosted runner and tooling
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT}"
          git --version
          python --version
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion'
          docker --version
          test "${RUNNER_ENVIRONMENT}" = "github-hosted"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify pinned Go version
        shell: bash
        run: |
          set -euo pipefail
          go version
          test "$(go env GOVERSION)" = "go$(tr -d '[:space:]' < .go-version)"

      - name: Parse branch-protection PowerShell tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/apply_main_protection.ps1','scripts/verify_main_protection.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($parseError in $errors) { Write-Host $parseError.Message }
              exit 1
            }
            Write-Host ('PowerShell parse validation PASS: ' + $path)
          }

      - name: Validate canonical governance state
        shell: bash
        run: python scripts/validate_governance.py

      - name: Validate repository and local-development specification
        shell: bash
        run: python scripts/validate_development_spec.py

      - name: Validate threat and operations specification
        shell: bash
        run: python scripts/validate_operations_spec.py

      - name: Validate foundation freeze review
        shell: bash
        run: python scripts/validate_freeze_review.py

      - name: Validate completed P01 prerequisite
        shell: bash
        run: python scripts/validate_p01_preparation.py

      - name: Validate completed P01 package specification set
        shell: bash
        run: python scripts/validate_p01_package_specs.py

      - name: Validate P02 implementation-readiness preparation
        shell: bash
        run: python scripts/validate_p02_preparation.py

      - name: Validate complete P02 package specification set
        shell: bash
        run: python scripts/validate_p02_package_specs.py

      - name: Verify repository Go code quality
        shell: bash
        run: bash scripts/verify_go_quality.sh

      - name: Verify P01.01 Go workspace and build skeleton
        shell: bash
        run: bash scripts/verify_p01_01.sh

      - name: Verify P01.02 configuration and environment system
        shell: bash
        run: bash scripts/verify_p01_02.sh

      - name: Verify P01.03 structured error and result conventions
        shell: bash
        run: bash scripts/verify_p01_03.sh

      - name: Verify P01.04 PostgreSQL connection and migration foundation
        shell: bash
        env:
          P01_04_TEST_DATABASE_URL: postgres://omnexa:synthetic-p01-04@127.0.0.1:5432/omnexa_p01_04?sslmode=disable
        run: bash scripts/verify_p01_04.sh

      - name: Verify P01.05 cache abstraction
        shell: bash
        env:
          P01_05_TEST_CACHE_ADDRESS: 127.0.0.1:6379
          P01_05_TEST_VALKEY_IMAGE: valkey/valkey:9.1.1
        run: bash scripts/verify_p01_05.sh

      - name: Verify P01.06 object and file storage abstraction
        shell: bash
        env:
          P01_06_TEST_S3_ENDPOINT: http://127.0.0.1:9090
          P01_06_TEST_S3_BUCKET: omnexa-p01-06
          P01_06_TEST_S3_IMAGE: adobe/s3mock:5.1.0
        run: bash scripts/verify_p01_06.sh

      - name: Verify P01.07 structured logging and OpenTelemetry baseline
        shell: bash
        run: bash scripts/verify_p01_07.sh

      - name: Verify P01.08 health readiness and diagnostics
        shell: bash
        run: bash scripts/verify_p01_08.sh

      - name: Verify P01.09 job and scheduler primitives
        shell: bash
        run: bash scripts/verify_p01_09.sh

      - name: Verify P01.10 feature flag and configuration registry
        shell: bash
        run: bash scripts/verify_p01_10.sh

      - name: Verify P01.11 audit transport foundation
        shell: bash
        run: bash scripts/verify_p01_11.sh

      - name: Verify P01.12 canonical developer aggregate and migration boundary
        shell: bash
        env:
          OMNEXA_ENVIRONMENT: ci
          OMNEXA_DATABASE_URL: postgres://omnexa:synthetic-p01-04@127.0.0.1:5432/omnexa_p01_04?sslmode=disable
          P01_04_TEST_DATABASE_URL: postgres://omnexa:synthetic-p01-04@127.0.0.1:5432/omnexa_p01_04?sslmode=disable
          P01_05_TEST_CACHE_ADDRESS: 127.0.0.1:6379
          P01_05_TEST_VALKEY_IMAGE: valkey/valkey:9.1.1
          P01_06_TEST_S3_ENDPOINT: http://127.0.0.1:9090
          P01_06_TEST_S3_BUCKET: omnexa-p01-06
          P01_06_TEST_S3_IMAGE: adobe/s3mock:5.1.0
        run: |
          set -euo pipefail
          go run ./kernel/cmd/omnexa db migrate
          go run ./kernel/cmd/omnexa verify all

      - name: Verify P01.12 developer CLI baseline
        shell: bash
        env:
          P01_12_TEST_DATABASE_URL: postgres://omnexa:synthetic-p01-04@127.0.0.1:5432/omnexa_p01_04?sslmode=disable
        run: bash scripts/verify_p01_12.sh

      - name: Verify P02.01 principal and User identity foundation
        shell: bash
        env:
          P02_01_TEST_DATABASE_URL: postgres://omnexa:synthetic-p01-04@127.0.0.1:5432/omnexa_p01_04?sslmode=disable
        run: bash scripts/verify_p02_01.sh

      - name: Verify P02.02 Tenant lifecycle and trusted tenant context
        shell: bash
        env:
          P02_02_TEST_DATABASE_URL: postgres://omnexa:synthetic-p01-04@127.0.0.1:5432/omnexa_p01_04?sslmode=disable
        run: bash scripts/verify_p02_02.sh
