name: Omnexa Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: governance-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report runner and tooling
        shell: cmd
        run: |
          echo RUNNER_NAME=%RUNNER_NAME%
          echo RUNNER_OS=%RUNNER_OS%
          echo RUNNER_ARCH=%RUNNER_ARCH%
          echo COMPUTERNAME=%COMPUTERNAME%
          git --version
          python --version
          powershell -NoLogo -NoProfile -Command "$PSVersionTable.PSVersion"
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if /I not "%RUNNER_ARCH%"=="X64" exit /b 1

      - name: Parse branch-protection PowerShell tooling
        shell: cmd
        run: >-
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command
          "$ErrorActionPreference='Stop'; foreach ($path in @('scripts/apply_main_protection.ps1','scripts/verify_main_protection.ps1')) { $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count -gt 0) { foreach ($parseError in $errors) { Write-Host $parseError.Message }; exit 1 }; Write-Host ('PowerShell parse validation PASS: ' + $path) }"

      - name: Validate canonical governance state
        shell: cmd
        run: python scripts\validate_governance.py

      - name: Validate repository and local-development specification
        shell: cmd
        run: python scripts\validate_development_spec.py

      - name: Validate threat and operations specification
        shell: cmd
        run: python scripts\validate_operations_spec.py

      - name: Validate foundation freeze review
        shell: cmd
        run: python scripts\validate_freeze_review.py

      - name: Validate P01 implementation-readiness preparation
        shell: cmd
        run: python scripts\validate_p01_preparation.py
