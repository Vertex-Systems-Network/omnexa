name: Omnexa Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify local Windows runner
        shell: pwsh
        run: |
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Runner OS:   $env:RUNNER_OS"
          Write-Host "Runner arch: $env:RUNNER_ARCH"
          Write-Host "Machine:     $env:COMPUTERNAME"

          if ($env:RUNNER_OS -ne "Windows") {
            throw "Expected a Windows self-hosted runner, got '$env:RUNNER_OS'."
          }

          git --version
          python --version

      - name: Validate canonical governance state
        shell: pwsh
        run: python scripts/validate_governance.py

      - name: Validate repository and local-development specification
        shell: pwsh
        run: python scripts/validate_development_spec.py

      - name: Validate threat and operations specification
        shell: pwsh
        run: python scripts/validate_operations_spec.py

      - name: Validate foundation freeze review
        shell: pwsh
        run: python scripts/validate_freeze_review.py
