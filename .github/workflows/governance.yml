name: Omnexa Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical governance state
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/validate_governance.py 2>&1 | tee governance-validation.txt

      - name: Upload governance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-validation-${{ github.run_id }}
          path: governance-validation.txt
          if-no-files-found: warn
          retention-days: 14
