name: P04.07 Readiness

on:
  push:
    branches:
      - "supervisor/p04-07-readiness-*"

permissions:
  contents: read

concurrency:
  group: p04-07-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    name: p04-07-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify P04.07 completion readiness
        shell: bash
        run: bash scripts/verify_p04_07.sh
